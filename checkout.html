<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">FASHION</div>
</header>

<section class="checkout-container">
  <div class="checkout-form">
    <a href="index.html" class="back-link">← Back to Home</a>
    <h1>CHECKOUT</h1>
    <form id="orderForm">
      <input type="text" id="fullName" name="fullname" placeholder="Full Name" required>

      <input type="email" id="email" name="email" placeholder="Email" required>

      <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>

      <input type="text" id="address" name="address" placeholder="Address" required>

      <button type="submit" class="place-order-btn">PLACE ORDER</button>
    </form>
  </div>

  <div class="order-summary" style="background: #0a0a0a; padding: 20px; border: 1px solid #333;">
    <a href="index.html" class="back-link" style="color: white; text-decoration: none; font-size: 12px; display: block; margin-bottom: 15px;"></a>
    <h2 style="color: white; border-bottom: 1px solid #333; padding-bottom: 10px;">YOUR ORDER</h2>

    <div id="checkoutItems"></div>
    <p id="total"> Total:</p>
    <span id="totalAmount"> 0 $</span>
    </div>


</section>
<script src="main.js"></script>
</body>
</html>
